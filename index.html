<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Kim Stylus — Login</title>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Kim Stylus" />
    <meta name="theme-color" content="#0d0d0d" />
    <link rel="manifest" href="manifest.json" />
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="login-page">
      <div class="card login-card">
        <h1>Bem-vindo</h1>
        <p class="subtitulo">Acesse sua conta para continuar</p>
        <div id="msgErro" class="msg-erro hidden"></div>
        <form id="formLogin">
          <div class="form-group">
            <label for="usuario">Usuário</label>
            <input
              type="text"
              id="usuario"
              placeholder="Digite seu usuário"
              autocomplete="username"
              required
            />
          </div>
          <div class="form-group">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              placeholder="Digite sua senha"
              autocomplete="current-password"
              required
            />
          </div>
          <button type="submit" class="btn btn-dourado">Entrar</button>
        </form>
      </div>
    </div>
    <div class="credito">Desenvolvido por Alessandro Brito</div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="js/firebase.js"></script>
    <script src="js/global.js"></script>
    <script src="js/login.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("./sw.js").catch(function (err) {
          console.log("SW erro:", err);
        });
      }
    </script>
  </body>
</html>
